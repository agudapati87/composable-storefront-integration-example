<ng-template #content>
  <span class="cta__label">{{ label() }}</span>
  <svg class="cta__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <circle cx="12" cy="12" r="12" />
    <path d="M10 7l5 5-5 5" />
  </svg>
</ng-template>

@if (internal(); as path) {
  <a class="cta" [class.cta--inverse]="variant() === 'inverse'" [routerLink]="path">
    <ng-container [ngTemplateOutlet]="content" />
  </a>
} @else if (external(); as href) {
  <a class="cta" [class.cta--inverse]="variant() === 'inverse'" [href]="href" rel="noopener">
    <ng-container [ngTemplateOutlet]="content" />
  </a>
}
